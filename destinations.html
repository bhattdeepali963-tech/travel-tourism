 <!DOCTYPE html>
<html lang="en" ng-app="travelApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Destinations</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f1eb;
        }

        nav {
            background: #6b4f3a;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
        }

        h1 {
            text-align: center;
            color: #3d2b1f;
            margin: 35px 0 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 280px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 12px #aaa;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .content {
            padding: 20px;
        }

        .content h2 {
            color: #6b4f3a;
            margin-top: 0;
        }

        .rating {
            color: #d49a00;
        }

        button {
            background: #6b4f3a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #4d3829;
        }
    </style>
</head>

<body ng-controller="DestinationController">

    <nav>
        <a href="index.html">Home</a>
        <a href="destinations.html">Destinations</a>
        <a href="packages.html">Packages</a>
        <a href="contact.html">Contact</a>
    </nav>

    <h1>Explore Amazing Destinations 🌍</h1>

    <p class="subtitle">
        Discover beautiful places and create unforgettable memories.
    </p>

    <div class="container">

        <div class="card" ng-repeat="place in destinations">

            <img ng-src="{{place.image}}" alt="{{place.name}}">

            <div class="content">

                <h2>{{place.name}}</h2>

                <p>{{place.description}}</p>

                <p><b>Best Time:</b> {{place.bestTime}}</p>

                <p class="rating">★★★★★ {{place.rating}}</p>

                <button ng-click="explore(place)">
                    Explore
                </button>

            </div>

        </div>

    </div>

    <script>

        var app = angular.module("travelApp", []);

        app.controller("DestinationController", function($scope) {

            $scope.destinations = [

                {
                    name: "Goa 🏖️",
                    description: "Enjoy beautiful beaches, sunsets and exciting water activities.",
                    bestTime: "November - February",
                    rating: "4.8/5",
                    image: "https://images.unsplash.com/photo-1512343879784-a960bf40e7f2"
                },

                {
                    name: "Manali 🏔️",
                    description: "Experience snow-covered mountains, nature and thrilling adventures.",
                    bestTime: "October - June",
                    rating: "4.7/5",
                    image: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4"
                },

                {
                    name: "Jaipur 🕌",
                    description: "Explore royal palaces, forts, traditional culture and delicious food.",
                    bestTime: "October - March",
                    rating: "4.6/5",
                    image: "https://images.unsplash.com/photo-1477587458883-47145ed94245"
                }

            ];

            $scope.explore = function(place) {
    window.location.href = "packages.html";
};

        });

    </script>

</body>

</html>
